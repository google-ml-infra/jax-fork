name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux-x86-ct4p-240-4tpu-quoct
    container: python:3.11
    steps:
    - name: Install JAX
      run: |
        pip install "jax[tpu,k8s]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html && pip install orbax
    - name: Run multi-device;
      run: |
        python -c "import jax; jax.distributed.initialize(); print(jax.devices()); print(jax.local_devices()); from orbax.checkpoint import test_utils; pytree, mesh_tree, axes_tree = test_utils.setup_sharded_pytree()"
    
