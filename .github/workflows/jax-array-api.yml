name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux-x86-ct4p-240-4tpu-quoct
    container: python:3.11
    steps:
    - name: Install Orbax
      run: |
        pip install "jax[tpu]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html && pip install orbax
    - name: Run multi-device;
      run: |
        python -c 'import jax; jax.distributed.initialize(coordinator_address=$MEGASCALE_COORDINATOR_ADDRESS, num_processes=2, process_id=$JOB_COMPLETION_INDEX,cluster_detection_method="deactivate"); print("Global device count:", jax.device_count())'
        sleep 60
