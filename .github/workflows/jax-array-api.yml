name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'yes'
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branches.
  cancel-in-progress: ${{ github.ref != 'main' }}
permissions: {}

jobs:
  documentation_render:
    name: Documentation - render documentation
    runs-on: ${{ matrix.runs-on }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-arm64:infrastructure-public-image-8f4da9c9607 
    timeout-minutes: 10
    strategy:
      matrix:
        runs-on: [test-linux-c4a-16]
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      with:
        persist-credentials: false
    - name: Image Setup
      run: |
        apt update
        apt install -y libssl-dev libsqlite3-dev build-essential
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install uv~=0.5.30
        uv pip install --system -r docs/requirements.txt
    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y unzip
    - name: Install Protoc Compiler
      uses: arduino/setup-protoc@v3
    - name: Run Protoc Compiler
      run: |
        protoc --version
    - name: Wait For Connection
      uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
      with:
        halt-dispatch-input: "yes"
