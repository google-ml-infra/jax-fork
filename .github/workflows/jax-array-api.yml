name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'no'
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    runs-on: linux-x86-g2-16-l4-1gpu-quoct
    container: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    strategy:
      matrix:
        python-version: [3.11]
    env:
      PYTHON: "python${{ matrix.python-version }}"
    steps:
    - name: Checkout jax
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      with:
        persist-credentials: false
    - name: Wait For Connection
      uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
      with:
        halt-dispatch-input: ${{ inputs.halt-for-connection }}
    - name: Checkout array-api-tests
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      with:
        repository: data-apis/array-api-tests
        ref: '2025.05.23'
        submodules: 'true'
        path: 'array-api-tests'
        persist-credentials: false
    - name: Install dependencies
      run: |
        $PYTHON -m uv pip install --system .[ci] pytest-xdist -r array-api-tests/requirements.txt
    - name: Run the test suite
      env:
        ARRAY_API_TESTS_MODULE: jax.numpy
        JAX_ENABLE_X64: 'true'
      run: |
        cd ${GITHUB_WORKSPACE}/array-api-tests
        $PYTHON -m pytest -n auto array_api_tests --derandomize --disable-deadline --skips-file ${GITHUB_WORKSPACE}/tests/array_api_skips.txt
