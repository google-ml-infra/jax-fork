name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'yes'
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branches.
  cancel-in-progress: ${{ github.ref != 'main' }}
permissions: {}

jobs:
  documentation_render:
    name: Documentation - render documentation
    runs-on:
      group: ml-actions-platform
      labels: ${{ matrix.runs-on }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    timeout-minutes: 10
    strategy:
      matrix:
        runs-on: [linux-x86-g2-48-l4-4gpu, linux-x86-n4-16]
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
      with:
        persist-credentials: false
    - name: Simulate running a job on
      run: |
        echo "Starting a job on runner: "
        sleep 30
        echo "Job finished on runner."
    - name: Run local composite action
      uses: ./.github/actions/hello-composite # Will fail to load
    - name: Image Setup
      run: |
        apt update
        apt install -y libssl-dev libsqlite3-dev build-essential
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install uv~=0.5.30
        uv pip install --system -r docs/requirements.txt
    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y unzip
    - name: Install Protoc Compiler
      uses: arduino/setup-protoc@v3
    - name: Run Protoc Compiler
      run: |
        protoc --version
