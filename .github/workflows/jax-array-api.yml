name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux-x86-g2-16-l4-1gpu-quoct
    container: python:3.11
    steps:
    - name: Install Orbax
      run: |
        pip install "jax[k8s]" && pip install orbax
        printenv
    - name: Run multi-device;
      run: |
        python -c 'import jax; import os; jax.distributed.initialize(); print("Global device count:", jax.device_count()); print(jax.local_devices())'
        sleep 60
