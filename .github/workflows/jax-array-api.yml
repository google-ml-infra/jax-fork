name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux-x86-ct4p-240-4tpu-quoct
    container: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.6.1-rev1
    steps:
    - name: Install Orbax
      run: |
        pip install "jax[tpu]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html && pip install orbax
    - name: Run multi-device;
      run: |
        JAX_PLATFORMS=tpu python -c "import jax; jax.distributed.initialize(); print(jax.devices()); print(jax.local_devices()); from orbax.checkpoint import test_utils; pytree, mesh_tree, axes_tree = test_utils.setup_sharded_pytree()"
    
