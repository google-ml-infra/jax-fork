name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: linux-x86-n2-32-quoct
    container: ghcr.io/nvidia/jax:jax
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install JAX
      run: |
        pip install -U jax[k8s]
    - name: Run multi-device
      run: |
        python -c "import jax; jax.distributed.initialize(); print(jax.devices()); print(jax.local_devices())"
    
