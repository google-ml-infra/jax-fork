name: JAX Array API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'yes'
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branches.
  cancel-in-progress: ${{ github.ref != 'main' }}
permissions: {}

env:
  UV_DEFAULT_INDEX: "https://us-python.pkg.dev/ml-oss-artifacts-published/pypi-mirror/simple"

jobs:
  build:
    strategy:
      matrix:
        python-version: [3.12]
        runners: ["quoct-test-ct5lp-hightpu-8t", "quoct-test-n2-16", "quoct-test-ct5lp-hightpu-8t", "quoct-test-n2-16"]
    runs-on: ${{ matrix.runners }}
    container:
      image: node:18
    env:
      PYTHON: "python${{ matrix.python-version }}"
    steps:
    - name: Checkout jax
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      with:
        persist-credentials: false
    - name: Checkout array-api-tests
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      with:
        repository: data-apis/array-api-tests
        ref: '2025.05.23'
        submodules: 'true'
        path: 'array-api-tests'
        persist-credentials: false
    - name: Install dependencies
      run: |
        sleep 100
