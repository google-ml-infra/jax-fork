name: GPU Runner Test

on: [workflow_dispatch, push]

jobs:
  test-gpu:
    name: Run GPU Smoke Test
    runs-on: gke-gpu
    container:
      image: nvidia/cuda:12.0.0-base-ubuntu22.04
    steps:
      - name: Check GPU Availability
        run: |
          echo "GPU Runner is successfully provisioned!"
          nvidia-smi || echo "nvidia-smi not found, checking driver..."
          ls -l /dev/shm

