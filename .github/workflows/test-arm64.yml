name: ARM64 Testing
on: [workflow_dispatch, push]

jobs:
  test-arm:
    runs-on: gke-c4a-arm64
    container:
      image: ubuntu:24.04
    steps:
      - name: Verify ARM64 Arch
        run: |
          echo "CPU Architecture:" && uname -m
          echo "Disk Storage Class check:" && df -Th /home/runner/_work

