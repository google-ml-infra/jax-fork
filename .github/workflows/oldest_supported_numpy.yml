# CI - Oldest Supported NumPy (presubmit)
# This workflow tests the oldest supported NumPy and jaxlib versions.

name: CI - Oldest Supported NumPy (presubmit)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'release/') && github.ref != 'main' }}

env:
  UV_DEFAULT_INDEX: "https://us-python.pkg.dev/ml-oss-artifacts-published/pypi-mirror/simple"

jobs:
  test-oldest-supported-numpy:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.runner }}
    container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest"
    name: "CI - Oldest Supported NumPy (${{ matrix.label }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "test-linux-n2-16"
            label: "with-gvisor"
          - runner: "test-linux-n2-16-no-sandbox"
            label: "without-gvisor"

    env:
      JAXCI_PYTHON: "python3.11"
      JAXCI_ENABLE_X64: 0
      JAX_NUM_GENERATED_CASES: 5

    steps:
      - name: Verify Kernel / Runtime Environment
        run: |
          echo "=== Kernel / Runtime Info ==="
          uname -a
          dmesg 2>/dev/null | head -n 2 || true

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          $JAXCI_PYTHON -m uv pip install -r build/test-requirements.txt

          # Install NumPy and SciPy with the oldest supported versions
          $JAXCI_PYTHON -m uv pip install numpy==2.0.0 scipy==1.13.0

          # Install JAX using the changes in the PR
          $JAXCI_PYTHON -m uv pip install -e .[minimum-jaxlib]

      - name: Run Pytest CPU tests
        timeout-minutes: 30
        run: ./ci/run_pytest_cpu.sh
